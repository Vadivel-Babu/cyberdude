<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Web Dev</title>
  </head>
  <body>
    <header class="header">
      <h1 class="logo">WD</h1>
      <nav class="nav">
        <a href="#" class="nav__link"> Home </a>
        <a href="#" class="nav__link"> About </a>
        <a href="#skill" class="nav__link"> Project </a>
        <a href="#contact" class="nav__link"> Contact</a>
        <img src="./images/Arrow 1.svg" class="mobile__link" alt="arrow" />
      </nav>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <div class="content">
            <div class="content__left">
              <h1 class="title">
                Learn Web Development from
                <span class="span">Zero to Pro</span>.
              </h1>
              <p class="description">
                Learn web development through practical projects, modern tools,
                and guidance to build real-world job-ready skills.
              </p>
              <button class="learn">Learn</button>
            </div>
            <div class="content__right">
              <div class="image">
                <img src="./images/computer.png" alt="computer" srcset="" />
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="skill" id="skill">
        <div class="container">
          <h1 class="skill__title">What you Learn</h1>
          <div class="card__wrapper">
            <div class="card">
              <img src="./images/html 1.png" alt="" srcset="" />
            </div>
            <div class="card">
              <img src="./images/css 1.png" class="css" alt="" srcset="" />
            </div>
            <div class="card">
              <img src="./images/js 1.png" class="js" alt="" srcset="" />
            </div>
          </div>
        </div>
      </section>
      <section class="contact" id="contact">
        <div class="container">
          <h1 class="skill__title">Contact Us</h1>
          <div class="container">
            <form class="form">
              <input type="text" name="name" placeholder="Name" class="input" />
              <input
                type="mail"
                name="email"
                placeholder="Email"
                class="input"
              />
              <textarea
                name="message"
                placeholder="Message"
                class="input"
              ></textarea>
              <button class="btn btn__submit">Submit</button>
            </form>
          </div>
        </div>
      </section>
      <footer>
        <p>@copyright 2025 for WD</p>
      </footer>
    </main>
  </body>
</html>
